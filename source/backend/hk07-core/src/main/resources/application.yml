spring:
  application:
    name: hk07-core
  mvc:
    async:
      request-timeout: 30000
  threads:
    virtual:
      enabled: true
  config:
    import:
      - optional:file:../.env[.properties]
  # ─── Database ───
  datasource:
    # ─── MySQL 8.x (Official Connector/J) ─────────────────────────────────────────
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:hk07db}?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:hk07user}
    # No real secret in source — provide DB_PASSWORD via env / .env (see source/backend/.env.example)
    password: ${DB_PASSWORD:HK040103}
    hikari:
      # Virtual Thread tuning: VT blocks OS thread on I/O — need more connections
      # than traditional thread pool. Rule: (vCPU * 2) + spindle count, min 10.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      keepalive-time: 60000         # Prevent idle connection drops
      max-lifetime: 600000
      data-source-properties:
        rewriteBatchedStatements: true  # Enable true JDBC batch execution for vitals bursts
  jpa:
    hibernate:
      ddl-auto: validate            # Flyway owns schema — JPA only validates
    show-sql: false                 # Disable SQL logging to reduce I/O
    open-in-view: false             # Disable OSIV — incompatible with Virtual Threads
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect  # Explicit MySQL dialect
        type:
          preferred_uuid_jdbc_type: VARCHAR               # Globally map Java UUID to VARCHAR(36) to match database VARCHAR(36)
        format_sql: false
        jdbc:
          batch_size: 50            # Increased batch size for 10Hz vitals bursts
          order_inserts: true       # Sort inserts by entity type to maximize batch grouping
          order_updates: true       # Same for updates
  # ─── Flyway (Database Migration Manager) ───
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true       # Allows migration on existing DB without flyway_schema_history
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false             # Strict ordering — no out-of-order migrations in production
    table: flyway_schema_history
  # ─── Redis (Motion buffer + session cache) ───
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 4             # Small pool, sufficient for sensor caching
          max-idle: 2

server:
  port: 8888
  tomcat:
    threads:
      max: 5                        # Virtual Threads handle the actual work; carrier pool is tiny
      min-spare: 1

# ─── HK-07 Custom Config ───
hk07:
  mqtt:
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    client-id: hk07-core-backend
    username: ${MQTT_USERNAME:hk07core}
    # No real secret in source — provide MQTT_PASSWORD via env / .env (see source/backend/.env.example)
    password: ${MQTT_PASSWORD:}
  ai:
    agent-url: ${AGENT_ENGINE_URL:http://localhost:8000}
    groq:
      api-key: ${GROQ_API_KEY:}     # Set via Docker env or .env file
    gemini:
      api-key: ${GEMINI_API_KEY:}
  security:
    jwt:
      secret: ${JWT_SECRET:hk07-dev-secret-change-in-production-min-32-chars}
      access-token-expiry-ms: 86400000    # 24 hours
      refresh-token-expiry-ms: 604800000 # 7 days
    internal-api-key: ${INTERNAL_API_KEY:hk07-internal-api-key-bypass}
  subsumption:
    safety-override-timeout-ms: 5      # HARD LIMIT: 5ms max response time

# ─── Logging ───
logging:
  level:
    com.hk07: INFO
    org.springframework.integration.mqtt: DEBUG
    org.hibernate: WARN
    com.mysql: ERROR                # mysql-connector-j driver
    org.flywaydb.core.internal.database.base.Database: ERROR
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{20} - %msg%n"
  file:
    path: ./logs
    name: ./logs/hk07-core.log
  logback:
    rollingpolicy:
      max-file-size: 1MB            # Hard cap per hardware constraint (no Disk Thrashing)
      max-history: 3
