# [HẠNCHẾ-#19 FIX] Mosquitto Replica Config (Bridge Mode)
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

# Bridge Configuration to Primary Node
connection replica-to-primary
address hk07-mosquitto:1883
remote_username hk07core
# Substituted at container start from $MQTT_PASSWORD by docker-entrypoint.sh
remote_password __MQTT_PASSWORD__
topic # both 0
topic hk07/# both 1
try_private true
cleansession false
notifications true
bridge_attempt_unsubscribe false
