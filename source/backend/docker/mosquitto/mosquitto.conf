# ─────────────────────────────────────────────────────────────────────────────
# HK-07 Mosquitto Configuration — P0-1: Authentication Enforced
# ─────────────────────────────────────────────────────────────────────────────

# [SECURITY] Disable anonymous connections — mandatory for medical-grade IoT
allow_anonymous false
password_file /mosquitto/config/passwd

# Listeners
listener 1883
protocol mqtt

listener 9001
protocol websockets

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice

# Connection limits (hardware constraint)
max_connections 50
max_queued_messages 200
message_size_limit 65536
