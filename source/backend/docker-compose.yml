# ─────────────────────────────────────────────────────────────────────────────
# HK-07 // HUGO SANITAS — Docker Compose Stack
# RAM Budget: ~615MB total (Dell Latitude E7270 constraint)
# ─────────────────────────────────────────────────────────────────────────────
networks:
  hk07-net:
    driver: bridge

volumes:
  mysql-data:
  mosquitto-data:
  mosquitto-log:
  ollama-data:

services:

  # ── [P0-2] MySQL — Primary persistent store ────────────────────────────────
  hk07-mysql:
    image: mysql:8.4
    container_name: hk07-mysql
    restart: unless-stopped
    init: true
    networks: [ hk07-net ]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD not set (see .env.example)}
      MYSQL_DATABASE: ${DB_DATABASE:-hk07db}
      MYSQL_USER: ${DB_USERNAME:-hk07user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set (see .env.example)}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "0.0.0.0:3306:3306" #- "3306:3306"
    # [P0-2] Healthcheck: hk07-core will not start until DB is truly ready
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── [P0-2] Redis — Token cache + message throttle buffer ───────────────────
  hk07-redis:
    image: redis:7.2-alpine
    container_name: hk07-redis
    restart: unless-stopped
    networks: [ hk07-net ]
    command: [ "redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru" ]
    ports:
      - "0.0.0.0:6379:6379" #- "6379:6379"
    # [P0-2] Healthcheck: ensures Redis is accepting commands
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M

  # ── [P0-1] Mosquitto — MQTT Broker with authentication enabled ─────────────
  hk07-mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: hk07-mosquitto
    restart: unless-stopped
    networks: [ hk07-net ]
    environment:
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD not set (see .env.example)}
    entrypoint: [ "/bin/sh", "/mosquitto/config/docker-entrypoint.sh" ]
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./docker/mosquitto/docker-entrypoint.sh:/mosquitto/config/docker-entrypoint.sh
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    ports:
      - "1883:1883"
      - "9001:9001"
    healthcheck:
      test: [ "CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-u", "hk07core", "-P", "${MQTT_PASSWORD}", "-i", "healthcheck", "-W", "3" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 32M

  # ── Ollama — Local offline AI models server ──────────────────────────────
  hk07-ollama:
    image: ollama/ollama:latest
    container_name: hk07-ollama
    restart: unless-stopped
    networks: [ hk07-net ]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_QUEUE=512
    # GPU Acceleration Setup (Production Ready / Nvidia Docker Toolkits)
    # Uncomment the following block if host machine has GPU passthrough enabled:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
